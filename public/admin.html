<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Redirection Service</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <h1>Link Manager</h1>
            <div class="input-group">
                <label for="password">Admin Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>

            <div id="adminControls" style="display: none; animation: fadeIn 0.5s ease-out;">
                <div class="input-group">
                    <label for="redirectUrl">Target URL</label>
                    <input type="url" id="redirectUrl" placeholder="https://example.com" required>
                </div>

                <div class="input-group">
                    <label for="newPassword">Change Password (Optional)</label>
                    <input type="password" id="newPassword" placeholder="Leave blank to keep same">
                </div>
                
                <button id="saveBtn" class="primary-btn">
                    <span>Update Settings</span>
                    <div class="loader" id="loader"></div>
                </button>
            </div>
            
            <div id="statusMessage" class="status-message"></div>
            
            <div class="info-section">
                <p>Visitors to <code>/</code> will be redirected to the URL above.</p>
                <a href="/" target="_blank" class="preview-link">Test Redirection &rarr;</a>
            </div>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const adminControls = document.getElementById('adminControls');
        const redirectUrlInput = document.getElementById('redirectUrl');
        const newPasswordInput = document.getElementById('newPassword');
        const saveBtn = document.getElementById('saveBtn');
        const statusMessage = document.getElementById('statusMessage');
        const loader = document.getElementById('loader');

        let correctPassword = '';

        // Fetch current config on page load to get the password
        async function init() {
            try {
                const response = await fetch('/api/config');
                const data = await response.json();
                correctPassword = data.adminPassword;
                redirectUrlInput.value = data.redirectUrl;
            } catch (err) {
                console.error('Failed to init');
            }
        }
        init();

        // Reveal controls if password matches
        passwordInput.addEventListener('input', () => {
            if (passwordInput.value === correctPassword) {
                adminControls.style.display = 'block';
                statusMessage.style.display = 'none';
            } else {
                adminControls.style.display = 'none';
            }
        });

        async function updateConfig() {
            const redirectUrl = redirectUrlInput.value;
            const password = passwordInput.value;
            const newPassword = newPasswordInput.value;

            if (!redirectUrl || !password) {
                showStatus('Please fill in required fields', 'error');
                return;
            }

            saveBtn.disabled = true;
            loader.style.display = 'block';
            statusMessage.style.display = 'none';

            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ redirectUrl, password, newPassword })
                });

                const result = await response.json();

                if (response.ok) {
                    showStatus('Settings updated successfully!', 'success');
                    if (newPassword) {
                        correctPassword = newPassword;
                        newPasswordInput.value = '';
                    }
                } else {
                    showStatus(result.error || 'Failed to update settings.', 'error');
                }
            } catch (err) {
                showStatus('Network error occurred.', 'error');
            } finally {
                saveBtn.disabled = false;
                loader.style.display = 'none';
            }
        }

        function showStatus(msg, type) {
            statusMessage.textContent = msg;
            statusMessage.className = `status-message ${type}`;
            statusMessage.style.display = 'block';
        }

        saveBtn.addEventListener('click', updateConfig);
    </script>
</body>
</html>
